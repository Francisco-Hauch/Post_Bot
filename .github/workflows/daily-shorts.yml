name: Daily YouTube Shorts

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília. Roda depois do Clip_Bot (09:00 UTC),
    # garantindo que a release do dia já exista.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Processar sem publicar no YouTube"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-youtube-shorts
  cancel-in-progress: false

jobs:
  post-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Publicar Shorts
        id: bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python bot.py

      - name: Commitar histórico atualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de shorts [skip ci]"
          git push
